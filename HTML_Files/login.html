<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTSITE - Авторизація</title>
    <link rel="stylesheet" href="../Styles/styles.css">
</head>
<body>
    <button class="back-button" onclick="window.location.href='index.html'">Назад на головну</button>

    <div class="container">
        <button class="social-btn facebook">
            <img src="https://img.icons8.com/?size=100&id=uLWV5A9vXIPu&format=png&color=000000" alt="Facebook Icon">
            Продовжити через Facebook
        </button>
        <button class="social-btn apple">
            <img src="https://img.icons8.com/?size=100&id=890&format=png&color=000000" alt="Apple Icon">
            Продовжити через Apple
        </button>
        <button class="social-btn google">
            <img src="https://img.icons8.com/?size=100&id=V5cGWnc9R4xj&format=png&color=000000" alt="Google Icon">
            Продовжити через Google
        </button>
        <hr>
        <p>чи</p>
        <div class="toggle-buttons">
            <button id="login-btn" onclick="toggleForm('login-form')">Увійти</button>
            <button id="register-btn" onclick="toggleForm('register-form')">Зареєструватися</button>
        </div>

        <div id="login-form" class="form-section">
            <form>
                <label>
                <input type="text" placeholder="Електронна пошта чи телефон" required>
                <input type="password" placeholder="Пароль" required>
                </label>
                <a href="#" class="forgot-password" onclick="toggleForm('forgot-password-form')">Забули пароль?</a>
                <button type="submit" class="login-btn">Увійти</button>
            </form>
        </div>

        <div id="register-form" class="form-section">
            <form>
                <label>
                <input type="text" placeholder="Ім'я" required>
                <input type="email" placeholder="Електронна пошта" required>
                <input type="password" placeholder="Пароль" required>
                </label>
                <div class="password-hints">
                    <p>Ваш пароль має містити:</p>
                    <ul>
                        <li>9 або більше символів</li>
                        <li>Велику літеру</li>
                        <li>Малу літеру</li>
                        <li>Мінімум одну цифру</li>
                    </ul>
                </div>
                <button type="submit" class="register-btn">Зареєструватися</button>
            </form>
        </div>

        <div id="forgot-password-form" class="form-section">
            <h2>Забули пароль?</h2>
            <p>Введіть вашу електронну пошту або номер телефону, щоб отримати код відновлення.</p>
            <form>
                <label>
                <input type="text" placeholder="Електронна пошта чи телефон" required>
                </label>
                <button type="button" id="send-code-btn" class="login-btn" onclick="startTimer()">Надіслати код</button>
            </form>
            <p id="timer" class="timer">Час залишився: 60 секунд</p>
            <a href="#" class="forgot-password" onclick="toggleForm('login-form')">Повернутися до входу</a>
        </div>
    </div>
    <script src="../TS_and_JS/script.js"></script>
</body>
</html>
